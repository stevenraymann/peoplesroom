<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Book The People’s Room</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f0f10;
      color: #fff;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 15px 0 5px;
      font-weight: 600;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #1a1a1d;
      color: #fff;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      background: #e63946;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      background: #ff4d5d;
    }

    .status {
      margin-top: 15px;
      font-size: 14px;
      color: #bbb;
    }

    .success { color: #4caf50; }
    .error { color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Book The People’s Room</h1>
    <p>Tell us about your act and we’ll get back to you.</p>

    <form id="bookingForm">
      <label>Artist / Band Name</label>
      <input type="text" name="artistName" required />

      <label>Email</label>
      <input type="email" name="email" required />

      <label>Phone</label>
      <input type="tel" name="phone" />

      <label>Message</label>
      <textarea name="message"></textarea>

      <button type="submit">Send Booking Request</button>
      <div class="status" id="status"></div>
    </form>
  </div>

  <script>
    const WORKER_URL =
      "https://peoplesroomshows.therealstevenmann.workers.dev";

    const form = document.getElementById("bookingForm");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      status.textContent = "Sending…";
      status.className = "status";

      const formData = new FormData(form);

      const payload = {
        artistName: formData.get("artistName"),
        email: formData.get("email"),
        phone: formData.get("phone"),
        message: formData.get("message"),
      };

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (res.ok) {
          status.textContent = "Request sent! We’ll be in touch soon.";
          status.className = "status success";
          form.reset();
        } else {
          throw new Error("Server error");
        }
      } catch (err) {
        status.textContent =
          "Something went wrong. Please try again later.";
        status.className = "status error";
      }
    });
  </script>
</body>
</html>
